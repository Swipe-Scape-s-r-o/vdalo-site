<!-- VDALO · «Живий готель» - мобільна версія (v4.1). Вставити одразу після десктопної секції. Потрібні living-hotel-mobile.css і .js -->
<section class="lhm" id="living-hotel-m" data-mode="chaos" aria-labelledby="lhm-title">
  <header class="lhm-head">
    <p class="lhm-eyebrow" id="lhm-eyebrow">Одна ніч вашого готелю</p>
    <h2 class="lhm-title" id="lhm-title">Ніч без системи. <em>Встигнете?</em></h2>
    <p class="sr-only" id="lhm-lead">Натискайте на червоні мітки, щоб вирішити проблеми, або увімкніть VDALO.</p>
  </header>
  <div class="lhm-hud">
    <div class="night" aria-hidden="true"><b id="lhm-clock">22:00</b><div class="night-bar"><i id="lhm-night"></i></div><span>07:00</span></div>
    <dl class="lhm-stats">
      <div class="lhm-stat" id="stm-occ"><dt>Заповн.</dt><dd><span data-stat="occ">71</span><small>%</small></dd></div>
      <div class="lhm-stat" id="stm-act"><dt>Проблем</dt><dd data-stat="act">0</dd></div>
      <div class="lhm-stat" id="stm-loss"><dt>Втрати, грн</dt><dd data-stat="loss">0</dd></div>
      <div class="lhm-stat" id="stm-wake"><dt>Вас будили</dt><dd data-stat="wake">0</dd></div>
    </dl>
  </div>
  <div class="lhm-stage" id="lhm-stage">
    <svg id="lhm-svg" viewBox="70 14 660 860" role="group" aria-label="Готель уночі. Червоні мітки - проблеми, торкніться, щоб вирішити." preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="lhmBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF92BD" stop-opacity="0"/><stop offset=".5" stop-color="#FF92BD" stop-opacity=".5"/><stop offset="1" stop-color="#FF92BD" stop-opacity="0"/></linearGradient>
        <linearGradient id="lhmShadeL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
        <linearGradient id="lhmShadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
      </defs>
    </svg>
  </div>
  <button type="button" class="lhm-ticker" id="lhm-ticker" aria-controls="lhm-sheet"><span class="ic" aria-hidden="true">i</span><span class="tx" id="lhm-ticker-text" aria-live="polite">Торкайтеся червоних «!» - або увімкніть VDALO</span><span class="more" aria-hidden="true">›</span></button>
  <div class="lhm-bar">
    <button type="button" class="lhm-btn lhm-btn-primary" id="lhm-switch"><span class="switch-dot" aria-hidden="true"></span><span id="lhm-switch-text">Увімкнути VDALO</span></button>
    <button type="button" class="lhm-btn lhm-btn-primary lhm-cta" id="lhm-cta" data-open="audit" data-interest="Демонстрація VDALO для мого об’єкта" data-location="living-hotel-mobile" hidden>Замовити демо</button>
    <button type="button" class="lhm-phone-btn" id="lhm-phone-btn" aria-controls="lhm-sheet" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
      <span class="lhm-badge" id="lhm-badge"></span><span class="sr-only">Телефон власника</span>
    </button>
  </div>
  <div class="lhm-sheet" id="lhm-sheet" role="dialog" aria-label="Телефон власника" aria-hidden="true">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><span id="phm-title">Ваш телефон</span><b id="phm-time">22:00</b><button type="button" class="sheet-close" id="lhm-sheet-close" aria-label="Закрити телефон">×</button></div>
    <div class="ph-widget" id="phm-widget"></div>
    <ol class="feed" id="lhm-feed"></ol>
  </div>
</section>
